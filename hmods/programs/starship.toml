add_newline = true

format = "$os [─](dimmed white)$directory$git_branch$git_status$cmd_duration$status$fill$time$line_break[ ╰─](dimmed white) $username$character"

[os]
disabled = false
format = "[$symbol](bold blue)"
symbols.NixOS = "  "

[directory]
format = "[ $path ](bold blue)"
truncation_length = 0
home_symbol = "~"

[git_branch]
format = "[$symbol$branch ](green)"

[git_status]
format = "[$all_status$ahead_behind ](green)"
untracked = "${count}? "
modified = "${count}! "
staged = "${count}+ "
ahead = "${count}»"

[cmd_duration]
min_time = 1_000
show_milliseconds = true
format = "[ $duration ](yellow)"

[status]
format = "[$symbol $status ](red)"

[fill]
symbol = "─"
style = "dimmed white"

[time]
disabled = false
format = "[$time](bold white)"
time_format = " %Y-%m-%d %H:%M:%S"

[character]
success_symbol = "[ ❯](bold white)"
error_symbol = "[ ❯](bold red)"

[username]
style_user = "purple bold"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always = true
